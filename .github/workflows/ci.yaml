name: CI - Vagrant VM provision and Docker deploy

permissions:
    contents: read

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-and-deploy:
        name: Build, provision and deploy
        runs-on: [ self-hosted, linux, gpu ]
        env:
            VM_NAME: devops-final
            VM_IP: 192.168.56.10
            IMAGE_NAME: mizkyosia/devops-tp-final
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Vérifier les outils nécessaires
              run: |
                  command -v vagrant
                  command -v ansible-playbook
                  command -v docker

            - name: Lancement Vagrant
              run: |
                  cd "$GITHUB_WORKSPACE"
                  vagrant up

            - name: Build image Docker
              run: |
                  cd "$GITHUB_WORKSPACE"
                  ls -R
                  pwd
                  docker build -t "$IMAGE_NAME" .

            - name: Deploy k3s cluster
              run: |
                  cd "$GITHUB_WORKSPACE"
                  vagrant ssh -- -c 'sudo k3s kubectl apply -f manifest.yaml'
