---
- hosts: all
  become: true
  tasks:
    - name: Install apt packages
      apt:
        pkg:
          - git
          - curl
          - wget
          - software-properties-common
        state: latest
        update_cache: yes

    - name: Add Grafana repository key
      apt_key:
        url: https://apt.grafana.com/gpg.key
        state: present

    - name: Add Grafana repository
      apt_repository:
        repo: deb https://apt.grafana.com stable main
        state: present

    - name: Install Grafana
      apt:
        name: grafana-server
        state: latest
        update_cache: yes

    - name: Create prometheus system user
      user:
        name: prometheus
        system: yes
        shell: /bin/false
        createhome: no

    - name: Create node_exporter system user
      user:
        name: node_exporter
        system: yes
        shell: /bin/false
        createhome: no

    - name: Create Prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download Prometheus
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
        dest: /tmp/prometheus-2.45.0.linux-amd64.tar.gz
        mode: '0644'

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus-2.45.0.linux-amd64.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Copy Prometheus binary
      copy:
        src: /tmp/prometheus-2.45.0.linux-amd64/prometheus
        dest: /usr/local/bin/prometheus
        owner: prometheus
        group: prometheus
        mode: '0755'
        remote_src: yes

    - name: Copy Promtool binary
      copy:
        src: /tmp/prometheus-2.45.0.linux-amd64/promtool
        dest: /usr/local/bin/promtool
        owner: prometheus
        group: prometheus
        mode: '0755'
        remote_src: yes

    - name: Copy Prometheus configuration
      copy:
        src: /tmp/prometheus-2.45.0.linux-amd64/prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        remote_src: yes

    - name: Configure Prometheus scrape config
      lineinfile:
        path: /etc/prometheus/prometheus.yml
        regexp: '  - job_name: ''prometheus'''
        line: '  - job_name: ''prometheus'''
        state: present

    - name: Download Node Exporter
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.6.1/node_exporter-1.6.1.linux-amd64.tar.gz
        dest: /tmp/node_exporter-1.6.1.linux-amd64.tar.gz
        mode: '0644'

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter-1.6.1.linux-amd64.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Copy Node Exporter binary
      copy:
        src: /tmp/node_exporter-1.6.1.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        owner: node_exporter
        group: node_exporter
        mode: '0755'
        remote_src: yes

    - name: Create Prometheus systemd service
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file /etc/prometheus/prometheus.yml \
            --storage.tsdb.path /var/lib/prometheus/ \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'

    - name: Create Node Exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start Node Exporter
      systemd:
        name: node_exporter
        enabled: yes
        state: started

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        enabled: yes
        state: started

    - name: Wait for Prometheus to start
      wait_for:
        port: 9090
        delay: 2
        timeout: 30

    - name: Wait for Node Exporter to start
      wait_for:
        port: 9100
        delay: 2
        timeout: 30

    - name: Enable and start Grafana
      systemd:
        name: grafana-server
        enabled: yes
        state: started

    - name: Wait for Grafana to start
      wait_for:
        port: 3000
        delay: 2
        timeout: 30

    - name: Create Grafana Prometheus data source
      grafana_datasource:
        name: Prometheus
        grafana_url: http://localhost:3000
        grafana_api_key: admin
        state: present
        ds_type: prometheus
        ds_url: http://localhost:9090
        access: proxy
      ignore_errors: yes