---
- hosts: vm-monitoring
  become: true
  tasks:
    # System dependencies
    - name: Update apt cache and install dependencies
      apt:
        pkg:
          - wget
          - curl
          - git
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: latest
        update_cache: yes

    # Docker installation
    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{
          ansible_lsb.codename }} stable"
        state: present

    - name: Install Docker
      apt:
        name: docker-ce
        state: latest
        update_cache: yes

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Compose
      shell: |
        curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
      args:
        executable: /bin/bash

    # Create monitoring directory
    - name: Create monitoring directory
      file:
        path: /opt/monitoring
        state: directory
        mode: "0755"

    # Prometheus configuration
    - name: Create Prometheus config directory
      file:
        path: /opt/monitoring/prometheus
        state: directory
        mode: "0755"

    - name: Create prometheus.yml configuration
      copy:
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'node_exporter'
              static_configs:
                - targets: ["192.168.56.10:9100", "192.168.56.10:9200"]
                  labels:
                    instance: 'k3s'
                - targets: ["192.168.56.11:9100"]
                  labels:
                    instance: 'monitoring'
        dest: /opt/monitoring/prometheus/prometheus.yml
        mode: "0644"

    # Docker Compose configuration
    - name: Create docker-compose.yml for monitoring stack
      copy:
        content: |
          version: '3.8'

          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              volumes:
                - /opt/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus-data:/prometheus
              ports:
                - "9090:9090"
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
              restart: unless-stopped
              networks:
                - monitoring

            node-exporter:
              image: prom/node-exporter:latest
              container_name: node-exporter
              ports:
                - "9100:9100"
              command:
                - '--path.procfs=/host/proc'
                - '--path.sysfs=/host/sys'
                - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              restart: unless-stopped
              networks:
                - monitoring

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin
                - GF_INSTALL_PLUGINS=grafana-piechart-panel
              volumes:
                - grafana-data:/var/lib/grafana
                - /opt/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
              ports:
                - "3000:3000"
              depends_on:
                - prometheus
              restart: unless-stopped
              networks:
                - monitoring

          volumes:
            prometheus-data:
            grafana-data:

          networks:
            monitoring:
              driver: bridge
        dest: /opt/monitoring/docker-compose.yml
        mode: "0644"

    # Grafana provisioning configuration
    - name: Create Grafana provisioning directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/monitoring/grafana/provisioning
        - /opt/monitoring/grafana/provisioning/datasources
        - /opt/monitoring/grafana/provisioning/dashboards

    - name: Create Grafana datasources provisioning
      copy:
        content: |
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: true
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"

    - name: Create Grafana dashboards provisioning
      copy:
        content: |
          apiVersion: 1

          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /etc/grafana/provisioning/dashboards
        dest: /opt/monitoring/grafana/provisioning/dashboards/dashboards.yml
        mode: "0644"

    # Download Node Exporter dashboard
    - name: Download Node Exporter dashboard JSON
      get_url:
        url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/refs/heads/master/prometheus/node-exporter-full.json
        dest: /opt/monitoring/grafana/provisioning/dashboards/node-exporter-dashboard.json
        mode: "0644"

    # Start monitoring stack
    - name: Start monitoring stack with docker-compose
      shell: |
        cd /opt/monitoring && docker-compose up -d
      args:
        executable: /bin/bash

    - name: Wait for Prometheus to be ready
      uri:
        url: http://localhost:9090/-/healthy
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 2

    - name: Wait for Grafana to be ready
      uri:
        url: http://localhost:3000/api/health
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 2

    - name: Display access information
      debug:
        msg:
          - "Monitoring stack deployed successfully!"
          - "Prometheus URL: http://192.168.56.11:9090"
          - "Grafana URL: http://192.168.56.11:3000"
          - "Grafana default credentials: admin / admin"
          - "Node Exporter: http://192.168.56.11:9100"
