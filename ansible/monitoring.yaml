---
- hosts: vm-monitoring
  become: true
  tasks:
    - name: Créer répertoire de monitoring
      file:
        path: /opt/monitoring
        state: directory
        mode: "0755"

    # Prometheus configuration
    - name: Prometheus config répertoire
      file:
        path: /opt/monitoring/prometheus
        state: directory
        mode: "0755"

    - name: Prometheus config
      copy:
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'node_exporter'
              static_configs:
                - targets: ["192.168.56.10:9100"]
                  labels:
                    instance: 'k3s'
                - targets: ["192.168.56.11:9100"]
                  labels:
                    instance: 'monitoring'
        dest: /opt/monitoring/prometheus/prometheus.yml
        mode: "0644"

    - name: Créer config docker-compose
      copy:
        content: |
          version: '3.8'

          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              volumes:
                - /opt/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - prometheus-data:/prometheus
              ports:
                - "9090:9090"
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
              restart: unless-stopped

            grafana:
              image: grafana/grafana:latest
              container_name: grafana
              environment:
                - GF_SECURITY_ADMIN_USER=admin
                - GF_SECURITY_ADMIN_PASSWORD=admin
                - GF_INSTALL_PLUGINS=grafana-piechart-panel
              volumes:
                - grafana-data:/var/lib/grafana
                - /opt/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
              ports:
                - "3000:3000"
              depends_on:
                - prometheus
              restart: unless-stopped

          volumes:
            prometheus-data:
            grafana-data:
        dest: /opt/monitoring/docker-compose.yml
        mode: "0644"

    - name: Grafana répertoires de provisioning
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/monitoring/grafana/provisioning
        - /opt/monitoring/grafana/provisioning/datasources
        - /opt/monitoring/grafana/provisioning/dashboards

    - name: Grafana datasources
      copy:
        content: |
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              editable: true
        dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
        mode: "0644"

    - name: Grafana dashboards provisioning
      copy:
        content: |
          apiVersion: 1

          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /etc/grafana/provisioning/dashboards
        dest: /opt/monitoring/grafana/provisioning/dashboards/dashboards.yml
        mode: "0644"

    - name: Téléchargement dashboard Node Exporter
      get_url:
        url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/refs/heads/master/prometheus/node-exporter-full.json
        dest: /opt/monitoring/grafana/provisioning/dashboards/node-exporter-dashboard.json
        mode: "0644"

    - name: Lancement stack de monitoring
      shell: |
        cd /opt/monitoring && docker-compose up -d
      args:
        executable: /bin/bash

    - name: En attente de Prometheus
      uri:
        url: http://localhost:9090/-/healthy
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 2

    - name: En attente de Grafana
      uri:
        url: http://localhost:3000/api/health
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 2

    - name: Affichage informations d'accès
      debug:
        msg:
          - "Monitoring stack deployed successfully!"
          - "Prometheus URL: http://192.168.56.11:9090"
          - "Grafana URL: http://192.168.56.11:3000"
          - "Grafana default credentials: admin / admin"
          - "Node Exporter: http://192.168.56.11:9100"
